name: auto-merge

# Zero-touch merge: merges eligible open PRs automatically using the built-in
# GITHUB_TOKEN (no secret to configure). No human approval click required.
#
# ELIGIBILITY (a PR is merged only if ALL are true):
#   - carries the `auto-merge` label   (the opt-in switch — keeps stale PRs out)
#   - is not a draft
#   - targets the default branch
#   - GitHub reports it mergeable (no conflicts)
#
# CONFLICTS are never force-resolved: a PR with conflicts is skipped and labeled
# `needs-rebase` so a human can resolve it. Nothing is ever merged broken.
#
# PROTECTED REPOS: on repos with a required-review ruleset, add `github-actions[bot]`
# (or Repository admin) to the ruleset Bypass list, or these merges will be blocked.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  schedule:
    - cron: '*/30 * * * *'   # sweep every 30 min to catch PRs whose checks finish later
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch=$(gh repo view "$REPO" --json defaultBranchRef -q .defaultBranchRef.name)
          echo "Default branch: $default_branch"

          gh pr list --repo "$REPO" --state open --label auto-merge --base "$default_branch" \
            --json number,isDraft -q '.[] | select(.isDraft==false) | .number' | while read -r pr; do
              [ -z "$pr" ] && continue
              echo "::group::PR #$pr"
              state=$(gh pr view "$pr" --repo "$REPO" --json mergeable,mergeStateStatus \
                        -q '.mergeable+" "+.mergeStateStatus')
              echo "state: $state"
              case "$state" in
                MERGEABLE*)
                  echo "merging #$pr"
                  gh pr merge "$pr" --repo "$REPO" --squash --delete-branch \
                    || echo "merge failed for #$pr (will retry next sweep)"
                  ;;
                CONFLICTING*)
                  echo "conflict on #$pr — flag needs-rebase, skip"
                  gh pr edit "$pr" --repo "$REPO" --add-label needs-rebase 2>/dev/null || true
                  ;;
                *)
                  echo "skip #$pr — state $state (will re-check next sweep)"
                  ;;
              esac
              echo "::endgroup::"
            done
