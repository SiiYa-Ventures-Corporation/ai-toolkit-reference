<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Toolkit Reference</title>
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #232340;
  --border: #2d2d50;
  --text: #e0e0f0;
  --text-dim: #8888aa;
  --accent: #7c5cfc;
  --accent2: #5c9cfc;
  --red: #fc5c7c;
  --green: #5cfc9c;
  --orange: #fcac5c;
  --yellow: #fcdc5c;
  --teal: #5cfcdc;
  --pink: #fc5cdc;
  --cat-agent: #fc5c7c;
  --cat-intel: #fcac5c;
  --cat-mcp: #5cfc9c;
  --cat-test: #7c5cfc;
  --cat-rules: #5cfcdc;
  --cat-ref: #fcdc5c;
  --graph-font: #e0e0f0;
  --graph-stroke: #0f0f1a;
  --graph-edge: #2d2d50;
}
[data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface2: #ebedf0;
  --border: #d0d5dd;
  --text: #1a1a2e;
  --text-dim: #5a5f7a;
  --accent: #6c4cec;
  --accent2: #3a7ce0;
  --graph-font: #1a1a2e;
  --graph-stroke: #ffffff;
  --graph-edge: #c0c4d0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
code, pre { font-family:'JetBrains Mono',monospace; }

/* Header */
.header { background:linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-bottom:1px solid var(--border); padding:20px 32px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(12px); }
.header h1 { font-size:22px; font-weight:700; background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.header .meta { font-size:13px; color:var(--text-dim); }

/* Search */
.search-bar { padding:16px 32px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.search-bar input { flex:1; min-width:200px; padding:10px 16px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; transition:border .2s; }
.search-bar input:focus { border-color:var(--accent); }
.filter-btn { padding:6px 14px; border-radius:16px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:12px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; }
.filter-btn:hover, .filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.filter-btn[data-cat="agent"].active { background:var(--cat-agent); border-color:var(--cat-agent); }
.filter-btn[data-cat="intel"].active { background:var(--cat-intel); border-color:var(--cat-intel); color:#000; }
.filter-btn[data-cat="mcp"].active { background:var(--cat-mcp); border-color:var(--cat-mcp); color:#000; }
.filter-btn[data-cat="test"].active { background:var(--cat-test); border-color:var(--cat-test); }
.filter-btn[data-cat="rules"].active { background:var(--cat-rules); border-color:var(--cat-rules); color:#000; }
.filter-btn[data-cat="ref"].active { background:var(--cat-ref); border-color:var(--cat-ref); color:#000; }

/* Layout */
.layout { display:flex; height:calc(100vh - 130px); position:relative; }
.graph-panel { width:40%; min-width:0; border-right:none; position:relative; display:flex; flex-direction:column; transition:width .3s ease, min-width .3s ease; }
.graph-panel.collapsed { width:0 !important; min-width:0 !important; overflow:hidden; }
.graph-panel .panel-top { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.graph-panel .label { font-size:11px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
#graph { width:100%; flex:1; min-height:200px; }
.cards-panel { flex:1; min-width:0; overflow-y:auto; padding:20px; transition:width .3s ease; }
.cards-panel.collapsed { width:0 !important; min-width:0 !important; overflow:hidden; padding:0; }

/* Resize handle */
.resize-handle { width:6px; cursor:col-resize; background:var(--border); position:relative; flex-shrink:0; z-index:20; transition:background .2s; }
.resize-handle:hover, .resize-handle.active { background:var(--accent); }
.resize-handle::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:2px; height:40px; background:var(--text-dim); border-radius:2px; opacity:.4; }
.resize-handle:hover::after { opacity:.8; background:var(--accent2); }

/* Collapse buttons */
.collapse-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:28px; height:28px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .2s; flex-shrink:0; }
.collapse-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.collapse-left { position:absolute; left:-34px; top:50%; transform:translateY(-50%); z-index:25; }
.collapse-right { position:absolute; right:-34px; top:50%; transform:translateY(-50%); z-index:25; }

/* Graph controls toolbar */
.graph-controls { display:flex; gap:4px; flex-shrink:0; flex-wrap:wrap; }
.graph-controls button { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); padding:4px 8px; border-radius:6px; cursor:pointer; font-size:11px; font-weight:500; transition:all .2s; white-space:nowrap; font-family:'Inter',sans-serif; }
.graph-controls button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.graph-controls button.active-ctrl { background:var(--accent); color:#fff; border-color:var(--accent); }
.graph-controls .sep { width:1px; background:var(--border); margin:0 2px; }

/* Fullscreen graph */
.graph-panel.fullscreen { position:fixed; top:0; left:0; width:100vw !important; height:100vh !important; z-index:9999; border-radius:0; }
.graph-panel.fullscreen .panel-top { border-radius:0; }
.fullscreen-hint { display:none; position:absolute; bottom:16px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--text-dim); background:var(--surface2); padding:4px 14px; border-radius:6px; border:1px solid var(--border); z-index:10; }
.graph-panel.fullscreen .fullscreen-hint { display:block; }

/* Theme toggle */
.theme-toggle { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:all .2s; }
.theme-toggle:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

/* Cards */
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:16px; overflow:hidden; transition:all .25s; }
.card:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 24px rgba(124,92,252,.15); }
.card.hidden { display:none; }
.card-header { padding:16px 20px; cursor:pointer; display:flex; align-items:center; gap:12px; }
.card-header .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.card-header h3 { font-size:15px; font-weight:600; flex:1; }
.card-header .badge { font-size:11px; padding:3px 10px; border-radius:12px; font-weight:500; }
.card-header .chevron { font-size:18px; color:var(--text-dim); transition:transform .2s; }
.card.open .card-header .chevron { transform:rotate(90deg); }
.card-body { padding:0 20px 20px; display:none; }
.card.open .card-body { display:block; }

/* Markdown content */
.card-body h2 { font-size:15px; font-weight:600; margin:16px 0 8px; color:var(--accent2); }
.card-body h3 { font-size:13px; font-weight:600; margin:12px 0 6px; color:var(--text); }
.card-body p { font-size:13px; line-height:1.6; color:var(--text-dim); margin:6px 0; }
.card-body ul, .card-body ol { font-size:13px; color:var(--text-dim); margin:6px 0 6px 20px; }
.card-body li { margin:3px 0; }
.card-body code { background:var(--surface2); padding:2px 6px; border-radius:4px; font-size:12px; color:var(--green); }
.card-body pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; margin:8px 0; overflow-x:auto; }
.card-body pre code { background:transparent; padding:0; color:var(--text-dim); }
.card-body table { width:100%; border-collapse:collapse; margin:8px 0; font-size:12px; }
.card-body th { text-align:left; padding:8px 10px; background:var(--surface2); color:var(--text); font-weight:600; border:1px solid var(--border); }
.card-body td { padding:8px 10px; border:1px solid var(--border); color:var(--text-dim); }
.card-body strong { color:var(--text); }
.card-body hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
.card-body a { color:var(--accent2); text-decoration:none; }
.card-body a:hover { text-decoration:underline; }

/* File link & meta row */
.card-meta { display:flex; align-items:center; gap:10px; padding:8px 20px; background:var(--bg); border-top:1px solid var(--border); flex-wrap:wrap; }
.card-meta a { font-size:11px; text-decoration:none; padding:4px 10px; border-radius:6px; font-weight:500; transition:all .2s; display:inline-flex; align-items:center; gap:5px; }
.card-meta .file-link { color:var(--green); background:rgba(92,252,156,.08); border:1px solid rgba(92,252,156,.2); }
.card-meta .file-link:hover { background:rgba(92,252,156,.18); }
.card-meta .gh-link { color:var(--accent2); background:rgba(92,156,252,.08); border:1px solid rgba(92,156,252,.2); }
.card-meta .gh-link:hover { background:rgba(92,156,252,.18); }
.card-meta .updated { font-size:11px; color:var(--text-dim); margin-left:auto; }

/* Header links */
.header-links { display:flex; gap:8px; align-items:center; }
.header-links a { font-size:12px; padding:6px 14px; border-radius:8px; text-decoration:none; font-weight:500; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
.header-links .gh-repo { color:#e0e0f0; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); }
.header-links .gh-repo:hover { background:rgba(255,255,255,.15); }
.header-links .oss-badge { color:#5cfc9c; background:rgba(92,252,156,.08); border:1px solid rgba(92,252,156,.2); }
.header-links .oss-badge:hover { background:rgba(92,252,156,.18); }

/* Stats bar */
.stats { display:flex; gap:20px; padding:12px 32px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; flex-wrap:wrap; }
.stat { font-size:12px; color:var(--text-dim); }
.stat span { color:var(--text); font-weight:600; }
.stat-cat { cursor:pointer; padding:2px 8px; border-radius:10px; transition:all .2s; border:1px solid transparent; }
.stat-cat:hover { border-color:currentColor; opacity:.9; }
.stat-cat.active-stat { border-color:currentColor; background:rgba(255,255,255,.08); }

/* Edge animation canvas overlay */
.edge-anim-canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; }

/* Responsive */
@media (max-width:900px) {
  .layout { flex-direction:column; height:auto; }
  .graph-panel { width:100% !important; height:400px; border-bottom:1px solid var(--border); }
  .cards-panel { width:100% !important; }
  .resize-handle { display:none; }
  .collapse-btn { display:none; }
  .header { flex-direction:column; gap:12px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>AI Toolkit Reference</h1>
    <div class="meta">16 Reference Guides &bull; SiiYa Ventures Corporation &bull; Open Source (MIT)</div>
  </div>
  <div class="header-links">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark/light theme">&#9788;</button>
    <a class="oss-badge" href="https://github.com/SiiYa-Ventures-Corporation/ai-toolkit-reference" target="_blank">&#9733; Open Source</a>
    <a class="gh-repo" href="https://github.com/SiiYa-Ventures-Corporation/ai-toolkit-reference" target="_blank">&#128193; Repo</a>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search reference guides..." autocomplete="off">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="agent">AI Agents</button>
  <button class="filter-btn" data-cat="intel">Code Intel</button>
  <button class="filter-btn" data-cat="mcp">MCP &amp; Obsidian</button>
  <button class="filter-btn" data-cat="test">Testing</button>
  <button class="filter-btn" data-cat="rules">Rules</button>
  <button class="filter-btn" data-cat="ref">Reference</button>
</div>

<div class="stats" id="stats"></div>

<div class="layout" id="layout">
  <div class="graph-panel" id="graphPanel">
    <div class="panel-top">
      <span class="label">Relationship Graph</span>
      <div class="graph-controls">
        <button onclick="graphFit()" title="Fit all nodes in view">Fit</button>
        <button onclick="graphZoomIn()" title="Zoom in">+</button>
        <button onclick="graphZoomOut()" title="Zoom out">&minus;</button>
        <div class="sep"></div>
        <button onclick="togglePhysics(this)" title="Toggle physics simulation" class="active-ctrl" id="btnPhysics">Physics</button>
        <button onclick="cycleLayout()" title="Switch graph layout" id="btnLayout">Layout</button>
        <div class="sep"></div>
        <button onclick="graphReset()" title="Reset to default view">Reset</button>
        <div class="sep"></div>
        <button onclick="exportPNG()" title="Download graph as PNG">PNG</button>
        <button onclick="toggleFullscreen()" title="Fullscreen graph" id="btnFullscreen">&#9974;</button>
      </div>
    </div>
    <div id="graph"></div>
    <span class="fullscreen-hint">Press ESC to exit fullscreen</span>
  </div>
  <div class="resize-handle" id="resizeHandle"></div>
  <div class="cards-panel" id="cards">
    <button class="collapse-btn collapse-left" id="collapseGraph" onclick="togglePanel('graph')" title="Collapse graph">&#9664;</button>
    <button class="collapse-btn collapse-right" id="collapseCards" onclick="togglePanel('cards')" title="Collapse cards">&#9654;</button>
  </div>
</div>

<script>
const GH_BASE = 'https://github.com/SiiYa-Ventures-Corporation/ai-toolkit-reference/blob/main/guides/';
// Use build-generated metadata if available, otherwise fallback
const SHEETS = (typeof SHEET_DEFS_META !== 'undefined' ? SHEET_DEFS_META : [
  {id:1,name:"Everything Claude Code",file:"Everything-Claude-Code",cat:"agent",catLabel:"AI Agent",color:"#fc5c7c",desc:"Master agent toolkit — 36 agents, 80+ skills, 30+ commands",links:[2,3,4,5,6,14],updated:"Apr 29, 2026"},
  {id:2,name:"Claude Code Plugins",file:"Claude-Code-Plugins",cat:"agent",catLabel:"AI Agent",color:"#fc5c7c",desc:"Plugin management — install, update, MCP servers",links:[1,3,5,14,6],updated:"Apr 29, 2026"},
  {id:3,name:"Claude Code Skills",file:"Claude-Code-Skills",cat:"agent",catLabel:"AI Agent",color:"#fc5c7c",desc:"Skill definitions — 1 custom, 6 GitNexus, 14 cluster",links:[1,2,7,4],updated:"Apr 29, 2026"},
  {id:4,name:"Claude Code Agents",file:"Claude-Code-Agents",cat:"agent",catLabel:"AI Agent",color:"#fc5c7c",desc:"7 AI roles with permissions and boundaries",links:[1,3,7,6,15],updated:"Apr 29, 2026"},
  {id:5,name:"Claude-Mem",file:"Claude-Mem",cat:"agent",catLabel:"AI Agent",color:"#fc5c7c",desc:"Persistent memory — SQLite + ChromaDB",links:[1,2,4],updated:"Apr 29, 2026"},
  {id:6,name:"Codex CLI",file:"Codex-CLI",cat:"agent",catLabel:"AI Agent",color:"#fc5c7c",desc:"Adversarial reviewer / FIA — SELECT only",links:[1,4,14,2],updated:"Apr 29, 2026"},
  {id:7,name:"GitNexus",file:"GitNexus",cat:"intel",catLabel:"Code Intel",color:"#fcac5c",desc:"Knowledge graph — 1,424 symbols, impact analysis",links:[3,4,8,1],updated:"Apr 29, 2026"},
  {id:8,name:"Graphify",file:"Graphify",cat:"intel",catLabel:"Code Intel",color:"#fcac5c",desc:"Visual graph generator — code to HTML+JSON",links:[7,3],updated:"Apr 29, 2026"},
  {id:9,name:"Playwright MCP",file:"Playwright-MCP",cat:"test",catLabel:"Testing",color:"#7c5cfc",desc:"Browser automation — navigate, click, screenshot",links:[14,1,15],updated:"Apr 29, 2026"},
  {id:10,name:"Obsidian MCP",file:"Obsidian-MCP",cat:"mcp",catLabel:"MCP",color:"#5cfc9c",desc:"Vault MCP bridge — port 3010 to REST API 27124",links:[13,14,11,12],updated:"Apr 29, 2026"},
  {id:11,name:"Obsidian API Reader",file:"Obsidian-API-Reader",cat:"mcp",catLabel:"MCP",color:"#5cfc9c",desc:"Direct PowerShell/batch REST vault access",links:[10,13,12],updated:"Apr 29, 2026"},
  {id:12,name:"Sync-To-Obsidian",file:"Sync-To-Obsidian",cat:"mcp",catLabel:"MCP",color:"#5cfc9c",desc:"Project-to-vault sync with routing rules",links:[10,11,13],updated:"Apr 29, 2026"},
  {id:13,name:"MCP Scripts",file:"MCP-Scripts",cat:"mcp",catLabel:"MCP",color:"#5cfc9c",desc:"7 launcher scripts — HTTP, stdio, clean restart",links:[14,10,11,12],updated:"Apr 29, 2026"},
  {id:14,name:"MCP Tool Configs",file:"MCP-Tool-Configs",cat:"mcp",catLabel:"MCP",color:"#5cfc9c",desc:"Per-tool JSON configs — Windsurf, Claude, ChatGPT, Codex",links:[13,10,2,1,6],updated:"Apr 29, 2026"},
  {id:15,name:"Windsurf Rules",file:"Windsurf-Rules",cat:"rules",catLabel:"Rules",color:"#5cfcdc",desc:"Terminal raw mode, frontend-only boundaries",links:[4,9,1],updated:"Apr 29, 2026"},
  {id:16,name:"500 AI Projects Reference",file:"500-AI-Projects-Reference",cat:"ref",catLabel:"Reference",color:"#fcdc5c",desc:"500+ ML/DL projects mapped to Tri-Lens",links:[],updated:"Apr 29, 2026"}
]);


// Category icons
const CAT_ICON = { agent:'\uD83E\uDD16', intel:'\uD83E\uDDE0', mcp:'\uD83D\uDD0C', test:'\uD83E\uDDEA', rules:'\uD83D\uDCCB', ref:'\uD83D\uDCDA' };

// Per-tool learning tips shown on hover
const TIPS = {
  1: 'Tip: Run /agents to list all 36 agents. Use /compact for token-efficient mode.',
  2: 'Tip: Use /plugins to manage installed plugins. Check MCP server status with /mcp.',
  3: 'Tip: Skills auto-activate by trigger phrase. Create custom skills in .claude/skills/.',
  4: 'Tip: Each agent has a FIA level (Full/Intermediate/Audit). Codex is audit-only.',
  5: 'Tip: Claude-Mem stores memories in SQLite + ChromaDB. Use /memory search to query.',
  6: 'Tip: Codex CLI is SELECT-only by default. Use --full-auto for write access.',
  7: 'Tip: Run npx gitnexus analyze to rebuild the index. Use gitnexus_impact before edits.',
  8: 'Tip: Graphify triggers on "draw diagram" or "visualize". Outputs HTML + JSON + audit.',
  9: 'Tip: Playwright MCP gives browser control. Use browser_navigate + browser_screenshot.',
  10: 'Tip: Obsidian MCP bridges port 3010 to the REST API on 27124. Needs Obsidian running.',
  11: 'Tip: Use read-obsidian-note.ps1 for direct vault access without MCP server.',
  12: 'Tip: sync-to-obsidian.ps1 routes files by extension. Only syncs included extensions.',
  13: 'Tip: Run start-mcp-server-http.bat for HTTP transport. Use stdio for Claude Desktop.',
  14: 'Tip: Each AI tool needs its own JSON config. Check mcp_config/ for per-tool files.',
  15: 'Tip: terminal_raw.md forces raw output mode. Windsurf is frontend-only in Tri-Lens.',
  16: 'Tip: Browse by category (NLP, Vision, RL) to find projects relevant to your pipeline.'
};

// Build graph nodes with icons + tooltips + tips
const nodesArr = SHEETS.map(s => ({
  id: s.id,
  label: (CAT_ICON[s.cat] || '') + ' ' + s.name,
  title: '<b>' + s.name + '</b><br>' + s.desc + '<br><i>' + s.links.length + ' connections</i><br><br>' + (TIPS[s.id] || ''),
  color: { background: s.color, border: s.color, highlight: { background: '#fff', border: s.color }, hover: { background: s.color + 'cc', border: '#fff' } },
  font: { color: getComputedStyle(document.documentElement).getPropertyValue('--graph-font').trim() || '#e0e0f0', size: 13, face: 'Inter', strokeWidth: 3, strokeColor: getComputedStyle(document.documentElement).getPropertyValue('--graph-stroke').trim() || '#0f0f1a' },
  size: s.links.length > 4 ? 30 : s.links.length > 2 ? 24 : 18,
  shape: 'dot',
  borderWidth: 2,
  shadow: { enabled: true, color: s.color + '40', size: 10 }
}));
const nodesDS = new vis.DataSet(nodesArr);

// Build edges — thickness based on shared connections (weight)
const edgeSet = new Set();
const edgesArr = [];
SHEETS.forEach(s => {
  s.links.forEach(t => {
    const key = [Math.min(s.id,t), Math.max(s.id,t)].join('-');
    if (!edgeSet.has(key)) {
      edgeSet.add(key);
      const target = SHEETS.find(x => x.id === t);
      const shared = target ? s.links.filter(l => target.links.includes(l)).length : 0;
      const w = 1 + Math.min(shared, 4) * 0.8;
      edgesArr.push({ from: s.id, to: t, color: { color: getComputedStyle(document.documentElement).getPropertyValue('--graph-edge').trim() || '#2d2d50', highlight: '#7c5cfc', hover: '#7c5cfc' }, width: w, smooth: { type: 'continuous' } });
    }
  });
});
const edgesDS = new vis.DataSet(edgesArr);

const container = document.getElementById('graph');
const defaultOpts = {
  physics: { barnesHut: { gravitationalConstant: -3000, centralGravity: 0.4, springLength: 120, damping: 0.5 }, stabilization: { iterations: 200 } },
  interaction: { hover: true, tooltipDelay: 200, navigationButtons: false, multiselect: false },
  layout: { improvedLayout: true }
};
let network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, defaultOpts);
network.once('stabilizationIterationsDone', () => {
  network.fit({ animation: { duration: 500 } });
});

function rebuildNetwork(opts) {
  network.destroy();
  network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, opts || defaultOpts);
  network.once('stabilizationIterationsDone', () => {
    network.fit({ animation: { duration: 500 } });
  });
  bindNetworkEvents();
}

// === Neighbor highlight on hover ===
let highlightActive = false;
function bindNetworkEvents() {
  network.on('hoverNode', params => { highlightNeighbors(params.node); });
  network.on('blurNode', () => { resetHighlight(); });
  network.on('click', params => {
    if (params.nodes.length) {
      const id = params.nodes[0];
      document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (card) { card.classList.add('open'); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
}
bindNetworkEvents();

function highlightNeighbors(nodeId) {
  const connNodes = network.getConnectedNodes(nodeId);
  const connEdges = network.getConnectedEdges(nodeId);
  const allNodes = nodesDS.get();
  const allEdges = edgesDS.get();
  allNodes.forEach(n => {
    if (n.id === nodeId || connNodes.includes(n.id)) {
      n.opacity = 1.0;
    } else {
      n.opacity = 0.15;
    }
  });
  allEdges.forEach(e => {
    if (connEdges.includes(e.id)) {
      e.color = { ...e.color, opacity: 1.0 };
      e.width = (e._origWidth || e.width) + 1;
    } else {
      e.color = { ...e.color, opacity: 0.08 };
    }
  });
  nodesDS.update(allNodes);
  edgesDS.update(allEdges);
  highlightActive = true;
}

function resetHighlight() {
  if (!highlightActive) return;
  const allNodes = nodesDS.get();
  const allEdges = edgesDS.get();
  allNodes.forEach(n => { n.opacity = 1.0; });
  allEdges.forEach(e => {
    e.color = { ...e.color, opacity: 1.0 };
    const s = SHEETS.find(x => x.id === e.from);
    const t = SHEETS.find(x => x.id === e.to);
    const shared = (s && t) ? s.links.filter(l => t.links.includes(l)).length : 0;
    e.width = 1 + Math.min(shared, 4) * 0.8;
  });
  nodesDS.update(allNodes);
  edgesDS.update(allEdges);
  highlightActive = false;
}

// Build cards
const cardsEl = document.getElementById('cards');
SHEETS.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.cat = s.cat;
  card.dataset.id = s.id;
  card.dataset.name = s.name.toLowerCase();
  card.dataset.file = s.file;
  const md = MD_CONTENT[s.file] || '';
  const html = marked.parse(md);
  const ghUrl = GH_BASE + s.file + '.md';
  card.innerHTML = `
    <div class="card-header">
      <div class="dot" style="background:${s.color}"></div>
      <h3>${s.name}</h3>
      <span class="badge" style="background:${s.color}22;color:${s.color};border:1px solid ${s.color}44">${s.catLabel}</span>
      <span class="chevron">&#9654;</span>
    </div>
    <div class="card-meta">
      <a class="file-link" href="${ghUrl}" target="_blank" title="Open source file">&#128196; ${s.file}.md</a>
      <a class="gh-link" href="${ghUrl}" target="_blank" title="View on GitHub">&#9733; GitHub</a>
      <span class="updated">Updated: ${s.updated}</span>
    </div>
    <div class="card-body">
      <p style="margin-bottom:12px;color:var(--text)">${s.desc}</p>
      <hr>
      ${html}
    </div>`;
  card.querySelector('.card-header').addEventListener('click', () => {
    card.classList.toggle('open');
  });
  cardsEl.appendChild(card);
});


// Search — syncs cards AND graph
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const matchIds = [];
  document.querySelectorAll('.card').forEach(c => {
    const match = c.dataset.name.includes(q) || c.querySelector('.card-body').textContent.toLowerCase().includes(q);
    c.classList.toggle('hidden', !match);
    if (match) matchIds.push(parseInt(c.dataset.id));
  });
  // Highlight matching nodes in graph
  if (q.length > 0) {
    const allNodes = nodesDS.get();
    allNodes.forEach(n => { n.opacity = matchIds.includes(n.id) ? 1.0 : 0.15; });
    nodesDS.update(allNodes);
    if (matchIds.length > 0 && matchIds.length <= 5) {
      network.selectNodes(matchIds);
    }
  } else {
    resetHighlight();
    network.setSelection({ nodes: [], edges: [] });
  }
  updateStats();
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', cat !== 'all' && c.dataset.cat !== cat);
    });
    if (cat === 'all') {
      network.setSelection({ nodes: [], edges: [] });
    } else {
      const ids = SHEETS.filter(s => s.cat === cat).map(s => s.id);
      network.selectNodes(ids);
    }
    updateStats();
  });
});

let activeStatCat = null;
function updateStats() {
  const visible = document.querySelectorAll('.card:not(.hidden)').length;
  const total = SHEETS.length;
  const cats = [
    { key:'agent', label:'Agent', count:SHEETS.filter(s=>s.cat==='agent').length },
    { key:'intel', label:'Intel', count:SHEETS.filter(s=>s.cat==='intel').length },
    { key:'mcp', label:'MCP', count:SHEETS.filter(s=>s.cat==='mcp').length },
    { key:'test', label:'Test', count:SHEETS.filter(s=>s.cat==='test').length },
    { key:'rules', label:'Rules', count:SHEETS.filter(s=>s.cat==='rules').length },
    { key:'ref', label:'Ref', count:SHEETS.filter(s=>s.cat==='ref').length }
  ];
  const catHtml = cats.map(c => {
    const active = activeStatCat === c.key ? ' active-stat' : '';
    return `<span class="stat-cat${active}" style="color:var(--cat-${c.key})" data-scat="${c.key}">${c.label} (${c.count})</span>`;
  }).join(' &bull; ');
  document.getElementById('stats').innerHTML = `
    <div class="stat">Showing <span>${visible}</span> of <span>${total}</span> guides</div>
    <div class="stat">Categories: ${catHtml}</div>
  `;
  // Bind click on stat categories
  document.querySelectorAll('.stat-cat').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.dataset.scat;
      if (activeStatCat === cat) {
        // Deselect — show all
        activeStatCat = null;
        document.querySelectorAll('.card').forEach(c => c.classList.remove('hidden'));
        resetHighlight();
        network.setSelection({ nodes: [], edges: [] });
        // Sync filter buttons to All
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.filter-btn[data-cat="all"]').classList.add('active');
      } else {
        // Select this category
        activeStatCat = cat;
        document.querySelectorAll('.card').forEach(c => {
          c.classList.toggle('hidden', c.dataset.cat !== cat);
        });
        // Highlight matching nodes, dim others
        const matchIds = SHEETS.filter(s => s.cat === cat).map(s => s.id);
        const allNodes = nodesDS.get();
        allNodes.forEach(n => { n.opacity = matchIds.includes(n.id) ? 1.0 : 0.15; });
        nodesDS.update(allNodes);
        network.selectNodes(matchIds);
        // Sync filter buttons
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        const matchBtn = document.querySelector(`.filter-btn[data-cat="${cat}"]`);
        if (matchBtn) matchBtn.classList.add('active');
      }
      updateStats();
    });
  });
}
updateStats();

// === Resize handle ===
const resizeHandle = document.getElementById('resizeHandle');
const graphPanel = document.getElementById('graphPanel');
const layout = document.getElementById('layout');
let isResizing = false;

resizeHandle.addEventListener('mousedown', e => {
  isResizing = true;
  resizeHandle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const rect = layout.getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  const clamped = Math.max(15, Math.min(85, pct));
  graphPanel.style.width = clamped + '%';
  network.redraw();
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    resizeHandle.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    network.fit({ animation: { duration: 300 } });
  }
});

// === Collapse / Expand ===
let graphCollapsed = false;
let cardsCollapsed = false;
const collapseGraphBtn = document.getElementById('collapseGraph');
const collapseCardsBtn = document.getElementById('collapseCards');

function togglePanel(which) {
  if (which === 'graph') {
    graphCollapsed = !graphCollapsed;
    graphPanel.classList.toggle('collapsed', graphCollapsed);
    resizeHandle.style.display = graphCollapsed ? 'none' : '';
    collapseGraphBtn.innerHTML = graphCollapsed ? '&#9654;' : '&#9664;';
    collapseGraphBtn.title = graphCollapsed ? 'Expand graph' : 'Collapse graph';
    if (!graphCollapsed) setTimeout(() => network.fit({ animation: true }), 350);
  } else {
    cardsCollapsed = !cardsCollapsed;
    document.getElementById('cards').classList.toggle('collapsed', cardsCollapsed);
    resizeHandle.style.display = cardsCollapsed ? 'none' : '';
    collapseCardsBtn.innerHTML = cardsCollapsed ? '&#9664;' : '&#9654;';
    collapseCardsBtn.title = cardsCollapsed ? 'Expand cards' : 'Collapse cards';
    if (!cardsCollapsed) setTimeout(() => network.fit({ animation: true }), 350);
  }
}

// === Graph Controls ===
let physicsOn = true;
let layoutMode = 0;
const layouts = ['default', 'hierarchical-UD', 'hierarchical-LR', 'circular'];

function graphFit() {
  network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
}

function graphZoomIn() {
  const scale = network.getScale();
  network.moveTo({ scale: scale * 1.4, animation: { duration: 300 } });
}

function graphZoomOut() {
  const scale = network.getScale();
  network.moveTo({ scale: scale / 1.4, animation: { duration: 300 } });
}

function togglePhysics(btn) {
  physicsOn = !physicsOn;
  network.setOptions({ physics: { enabled: physicsOn } });
  btn.classList.toggle('active-ctrl', physicsOn);
  btn.title = physicsOn ? 'Disable physics' : 'Enable physics';
}

function cycleLayout() {
  layoutMode = (layoutMode + 1) % layouts.length;
  const mode = layouts[layoutMode];
  const btn = document.getElementById('btnLayout');
  if (mode === 'default') {
    btn.textContent = 'Layout';
    rebuildNetwork({
      ...defaultOpts,
      physics: { ...defaultOpts.physics, enabled: physicsOn }
    });
  } else if (mode === 'hierarchical-UD') {
    btn.textContent = 'Tree \u2193';
    rebuildNetwork({
      layout: { hierarchical: { enabled: true, direction: 'UD', sortMethod: 'hubsize', levelSeparation: 100 } },
      physics: { enabled: physicsOn, hierarchicalRepulsion: { centralGravity: 0.3, springLength: 120 } },
      interaction: defaultOpts.interaction
    });
  } else if (mode === 'hierarchical-LR') {
    btn.textContent = 'Tree \u2192';
    rebuildNetwork({
      layout: { hierarchical: { enabled: true, direction: 'LR', sortMethod: 'hubsize', levelSeparation: 150 } },
      physics: { enabled: physicsOn, hierarchicalRepulsion: { centralGravity: 0.3, springLength: 120 } },
      interaction: defaultOpts.interaction
    });
  } else if (mode === 'circular') {
    btn.textContent = 'Circle';
    rebuildNetwork({
      layout: { hierarchical: false },
      physics: { enabled: false },
      interaction: defaultOpts.interaction
    });
    const r = 250;
    SHEETS.forEach((s, i) => {
      const angle = (2 * Math.PI * i) / SHEETS.length - Math.PI / 2;
      network.moveNode(s.id, r * Math.cos(angle), r * Math.sin(angle));
    });
    setTimeout(() => network.fit({ animation: { duration: 500 } }), 100);
  }
}

function graphReset() {
  layoutMode = 0;
  physicsOn = true;
  document.getElementById('btnPhysics').classList.add('active-ctrl');
  document.getElementById('btnLayout').textContent = 'Layout';
  rebuildNetwork();
  resetHighlight();
}

// === Export as PNG ===
function exportPNG() {
  const canvas = container.querySelector('canvas');
  if (!canvas) return;
  const link = document.createElement('a');
  link.download = 'ai-toolkit-reference-graph.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// === Fullscreen ===
function toggleFullscreen() {
  graphPanel.classList.toggle('fullscreen');
  setTimeout(() => network.fit({ animation: { duration: 400 } }), 100);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && graphPanel.classList.contains('fullscreen')) {
    graphPanel.classList.remove('fullscreen');
    setTimeout(() => network.fit({ animation: { duration: 400 } }), 100);
  }
});

// === Theme toggle ===
let currentTheme = 'dark';
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  const btn = document.getElementById('themeToggle');
  btn.innerHTML = currentTheme === 'dark' ? '&#9788;' : '&#9790;';
  btn.title = currentTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  // Update graph colors
  const cs = getComputedStyle(document.documentElement);
  const fontColor = cs.getPropertyValue('--graph-font').trim();
  const strokeColor = cs.getPropertyValue('--graph-stroke').trim();
  const edgeColor = cs.getPropertyValue('--graph-edge').trim();
  const allNodes = nodesDS.get();
  allNodes.forEach(n => {
    n.font = { ...n.font, color: fontColor, strokeColor: strokeColor };
  });
  nodesDS.update(allNodes);
  const allEdges = edgesDS.get();
  allEdges.forEach(e => {
    e.color = { ...e.color, color: edgeColor };
  });
  edgesDS.update(allEdges);
}

// === Animated edge pulses ===
let animRunning = false;
let animFrame = null;
function startEdgeAnimation() {
  if (animRunning) return;
  animRunning = true;
  const canvas = document.createElement('canvas');
  canvas.className = 'edge-anim-canvas';
  const graphDiv = document.getElementById('graph');
  graphDiv.style.position = 'relative';
  graphDiv.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let t = 0;
  function draw() {
    if (!animRunning) { canvas.remove(); return; }
    canvas.width = graphDiv.offsetWidth;
    canvas.height = graphDiv.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const positions = network.getPositions();
    const scale = network.getScale();
    const viewPos = network.getViewPosition();
    edgesArr.forEach(e => {
      const from = positions[e.from];
      const to = positions[e.to];
      if (!from || !to) return;
      const fx = (from.x - viewPos.x) * scale + canvas.width / 2;
      const fy = (from.y - viewPos.y) * scale + canvas.height / 2;
      const tx = (to.x - viewPos.x) * scale + canvas.width / 2;
      const ty = (to.y - viewPos.y) * scale + canvas.height / 2;
      const progress = ((t * 0.003) + (e.from * 0.1)) % 1;
      const px = fx + (tx - fx) * progress;
      const py = fy + (ty - fy) * progress;
      ctx.beginPath();
      ctx.arc(px, py, 3 * scale, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(124, 92, 252, 0.6)';
      ctx.fill();
    });
    t++;
    animFrame = requestAnimationFrame(draw);
  }
  draw();
}
function stopEdgeAnimation() {
  animRunning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  const c = document.querySelector('.edge-anim-canvas');
  if (c) c.remove();
}
// Start animation by default — toggle with: startEdgeAnimation() / stopEdgeAnimation()
startEdgeAnimation();

</script>
