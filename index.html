<html lang="en">
<head>

<title>AI Toolkit Reference</title>
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #232340;
  --border: #2d2d50;
  --text: #e0e0f0;
  --text-dim: #8888aa;
  --accent: #7c5cfc;
  --accent2: #5c9cfc;
  --red: #fc5c7c;
  --green: #5cfc9c;
  --orange: #fcac5c;
  --yellow: #fcdc5c;
  --teal: #5cfcdc;
  --pink: #fc5cdc;
  --cat-agent: #fc5c7c;
  --cat-intel: #fcac5c;
  --cat-mcp: #5cfc9c;
  --cat-test: #7c5cfc;
  --cat-rules: #5cfcdc;
  --cat-ref: #fcdc5c;
  --cat-creative: #fc5ce8;
  --graph-font: #e0e0f0;
  --graph-stroke: #0f0f1a;
  --graph-edge: #2d2d50;
}
[data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface2: #ebedf0;
  --border: #d0d5dd;
  --text: #1a1a2e;
  --text-dim: #3a3f5a;
  --accent: #5a3ad8;
  --accent2: #2a60c0;
  --red: #c0304a;
  --green: #1a8a4a;
  --orange: #b07020;
  --yellow: #907010;
  --teal: #0a7a7a;
  --pink: #b030a0;
  --cat-agent: #c0304a;
  --cat-intel: #b07020;
  --cat-mcp: #1a8a4a;
  --cat-test: #5a3ad8;
  --cat-rules: #0a7a7a;
  --cat-ref: #907010;
  --cat-creative: #b030a0;
  --graph-font: #1a1a2e;
  --graph-stroke: #ffffff;
  --graph-edge: #a0a8b8;
}
[data-theme="light"] .header { background:linear-gradient(135deg, #e8eaf0 0%, #d8dce8 100%); }
[data-theme="light"] .header h1 { -webkit-text-fill-color:transparent; background:linear-gradient(135deg, #5a3ad8, #2a60c0); -webkit-background-clip:text; background-clip:text; }
[data-theme="light"] .header .meta { color:#3a3f5a; }
[data-theme="light"] .header-links .gh-repo { color:#1a1a2e; background:rgba(0,0,0,.06); border-color:rgba(0,0,0,.15); }
[data-theme="light"] .header-links .oss-badge { color:#1a8a4a; }
[data-theme="light"] .card-body code { color:#1a8a4a; }
[data-theme="light"] .card-meta .file-link { color:#1a8a4a; }
[data-theme="light"] .stat-cat.active-stat { background:rgba(0,0,0,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
code, pre { font-family:'JetBrains Mono',monospace; }

/* Header */
.header { background:linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-bottom:1px solid var(--border); padding:20px 32px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(12px); }
.header h1 { font-size:22px; font-weight:700; background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.header .meta { font-size:13px; color:var(--text-dim); }

/* Search & filter bar */
.search-bar { padding:12px 32px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.search-bar input { flex:1; min-width:200px; padding:10px 16px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; transition:border .2s; }
.search-bar input:focus { border-color:var(--accent); }

/* Dropdown wrapper */
.dropdown-wrap { position:relative; display:inline-block; }
.dropdown-toggle { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:12px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; font-family:'Inter',sans-serif; display:inline-flex; align-items:center; gap:6px; }
.dropdown-toggle:hover { border-color:var(--accent); }
.dropdown-toggle .arrow { font-size:9px; transition:transform .2s; }
.dropdown-wrap.open .dropdown-toggle .arrow { transform:rotate(180deg); }
.dropdown-menu { display:none; position:absolute; top:calc(100% + 4px); left:0; min-width:220px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 32px rgba(0,0,0,.25); z-index:200; padding:8px 0; max-height:360px; overflow-y:auto; }
.dropdown-wrap.open .dropdown-menu { display:block; }
.dropdown-menu label { display:flex; align-items:center; gap:10px; padding:8px 16px; font-size:12px; color:var(--text); cursor:pointer; transition:background .15s; user-select:none; }
.dropdown-menu label:hover { background:var(--surface2); }
.dropdown-menu label.disabled { opacity:.4; cursor:not-allowed; pointer-events:none; }
.dropdown-menu label .dot-swatch { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.dropdown-menu input[type="checkbox"] { accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
.dropdown-menu .dd-divider { height:1px; background:var(--border); margin:6px 0; }
.dropdown-menu .dd-footer { padding:8px 12px; display:flex; gap:8px; justify-content:flex-end; border-top:1px solid var(--border); margin-top:4px; }
.dd-apply-btn { padding:5px 16px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-size:11px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s; }
.dd-apply-btn:hover { filter:brightness(1.15); }
.dd-reset-btn { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:11px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s; }
.dd-reset-btn:hover { border-color:var(--accent); color:var(--text); }
.provider-icon { width:16px; height:16px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex-shrink:0; }
.provider-icon.claude { background:#fc5c7c; color:#fff; }
.provider-icon.chatgpt { background:#74aa9c; color:#fff; }
.provider-icon.gemini { background:#4285f4; color:#fff; }

/* Layout */
.layout { display:flex; height:calc(100vh - 130px); position:relative; }
.graph-panel { width:75%; min-width:0; border-right:none; position:relative; display:flex; flex-direction:column; transition:width .3s ease, min-width .3s ease; }
.graph-panel.collapsed { width:0 !important; min-width:0 !important; overflow:hidden; }
.graph-panel .panel-top { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.graph-panel .label { font-size:11px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
#graph { width:100%; flex:1; min-height:200px; }
.cards-panel { flex:1; min-width:0; overflow-y:auto; padding:0; transition:width .3s ease; display:flex; flex-direction:column; }
.cards-panel .panel-top { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.cards-panel .label { font-size:11px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
.cards-inner { flex:1; overflow-y:auto; padding:20px; }
.cards-panel.collapsed { width:0 !important; min-width:0 !important; overflow:hidden; padding:0; }

/* Resize handle */
.resize-handle { width:6px; cursor:col-resize; background:var(--border); position:relative; flex-shrink:0; z-index:20; transition:background .2s; }
.resize-handle:hover, .resize-handle.active { background:var(--accent); }
.resize-handle::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:2px; height:40px; background:var(--text-dim); border-radius:2px; opacity:.4; }
.resize-handle:hover::after { opacity:.8; background:var(--accent2); }

/* Collapse buttons */
.collapse-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:28px; height:28px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .2s; flex-shrink:0; }
.collapse-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.collapse-left { position:absolute; left:-34px; top:50%; transform:translateY(-50%); z-index:25; }
.collapse-right { position:absolute; right:-34px; top:50%; transform:translateY(-50%); z-index:25; }

/* Graph controls toolbar */
.graph-controls { display:flex; gap:4px; flex-shrink:0; flex-wrap:wrap; }
.graph-controls button { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); padding:4px 8px; border-radius:6px; cursor:pointer; font-size:11px; font-weight:500; transition:all .2s; white-space:nowrap; font-family:'Inter',sans-serif; }
.graph-controls button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.graph-controls button.active-ctrl { background:var(--accent); color:#fff; border-color:var(--accent); }
.graph-controls .sep { width:1px; background:var(--border); margin:0 2px; }

/* Fullscreen graph */
.graph-panel.fullscreen { position:fixed; top:0; left:0; width:100vw !important; height:100vh !important; z-index:9999; border-radius:0; }
.graph-panel.fullscreen .panel-top { border-radius:0; }
.fullscreen-hint { display:none; position:absolute; bottom:16px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--text-dim); background:var(--surface2); padding:4px 14px; border-radius:6px; border:1px solid var(--border); z-index:10; }
.graph-panel.fullscreen .fullscreen-hint { display:block; }

/* Theme toggle */
.theme-toggle { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:all .2s; }
.theme-toggle:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

/* Cards */
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:16px; overflow:hidden; transition:all .25s; }
.card:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 24px rgba(124,92,252,.15); }
.card.hidden { display:none; }
.card-header { padding:16px 20px; cursor:pointer; display:flex; align-items:center; gap:12px; }
.card-header .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.card-header h3 { font-size:16px; font-weight:600; flex:1; }
.card-header .badge { font-size:11px; padding:3px 10px; border-radius:12px; font-weight:500; }
.card-header .chevron { font-size:18px; color:var(--text-dim); transition:transform .2s; }
.card.open .card-header .chevron { transform:rotate(90deg); }
.card-body { padding:0 20px 20px; display:none; }
.card.open .card-body { display:block; }

/* Markdown content */
.card-body h2 { font-size:16px; font-weight:600; margin:16px 0 8px; color:var(--accent2); }
.card-body h3 { font-size:14px; font-weight:600; margin:12px 0 6px; color:var(--text); }
.card-body p { font-size:14px; line-height:1.6; color:var(--text-dim); margin:6px 0; }
.card-body ul, .card-body ol { font-size:14px; color:var(--text-dim); margin:6px 0 6px 20px; }
.card-body li { margin:3px 0; }
.card-body code { background:var(--surface2); padding:2px 6px; border-radius:4px; font-size:13px; color:var(--green); }
.card-body pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; margin:8px 0; overflow-x:auto; }
.card-body pre code { background:transparent; padding:0; color:var(--text-dim); }
.card-body table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
.card-body th { text-align:left; padding:8px 10px; background:var(--surface2); color:var(--text); font-weight:600; border:1px solid var(--border); }
.card-body td { padding:8px 10px; border:1px solid var(--border); color:var(--text-dim); }
.card-body strong { color:var(--text); }
.card-body hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
.card-body a { color:var(--accent2); text-decoration:none; }
.card-body a:hover { text-decoration:underline; }

/* File link & meta row */
.card-meta { display:flex; align-items:center; gap:10px; padding:8px 20px; background:var(--bg); border-top:1px solid var(--border); flex-wrap:wrap; }
.card-meta a { font-size:11px; text-decoration:none; padding:4px 10px; border-radius:6px; font-weight:500; transition:all .2s; display:inline-flex; align-items:center; gap:5px; }
.card-meta .file-link { color:var(--green); background:rgba(92,252,156,.08); border:1px solid rgba(92,252,156,.2); }
.card-meta .file-link:hover { background:rgba(92,252,156,.18); }
.card-meta .gh-link { color:var(--accent2); background:rgba(92,156,252,.08); border:1px solid rgba(92,156,252,.2); }
.card-meta .gh-link:hover { background:rgba(92,156,252,.18); }
.card-meta .updated { font-size:11px; color:var(--text-dim); margin-left:auto; }

/* Header links */
.header-links { display:flex; gap:8px; align-items:center; }
.header-links a { font-size:12px; padding:6px 14px; border-radius:8px; text-decoration:none; font-weight:500; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
.header-links .gh-repo { color:#e0e0f0; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); }
.header-links .gh-repo:hover { background:rgba(255,255,255,.15); }
.header-links .oss-badge { color:#5cfc9c; background:rgba(92,252,156,.08); border:1px solid rgba(92,252,156,.2); }
.header-links .oss-badge:hover { background:rgba(92,252,156,.18); }

/* Stats bar */
.stats { display:flex; gap:20px; padding:12px 32px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; flex-wrap:wrap; }
.stat { font-size:12px; color:var(--text-dim); }
.stat span { color:var(--text); font-weight:600; }
.stat-cat { cursor:pointer; padding:2px 8px; border-radius:10px; transition:all .2s; border:1px solid transparent; }
.stat-cat:hover { border-color:currentColor; opacity:.9; }
.stat-cat.active-stat { border-color:currentColor; background:rgba(255,255,255,.08); }

/* Edge animation canvas overlay */
.edge-anim-canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; }

/* Responsive */
@media (max-width:900px) {
  .layout { flex-direction:column; height:auto; }
  .graph-panel { width:100% !important; height:400px; border-bottom:1px solid var(--border); }
  .cards-panel { width:100% !important; }
  .resize-handle { display:none; }
  .collapse-btn { display:none; }
  .header { flex-direction:column; gap:12px; }
}
</style>
</head>

const GH_BASE = 'https://github.com/SiiYa-Ventures-Corporation/ai-toolkit-reference/blob/main/guides/';
// Use build-generated metadata if available, otherwise fallback
const SHEETS = (typeof SHEET_DEFS_META !== 'undefined' ? SHEET_DEFS_META : [
  {id:1,name:"Everything Claude Code",file:"Everything-Claude-Code",cat:"agent",catLabel:"AI Agent",color:"#fc5c7c",desc:"Master agent toolkit — 36 agents, 80+ skills, 30+ commands",links:[2,3,4,5,6,14],updated:"Apr 29, 2026"},

// Tooltip builder — returns a styled DOM element for clean wrapping
function makeTooltip(s) {
  const el = document.createElement('div');
  el.style.cssText = 'max-width:260px;padding:10px 14px;font-family:Inter,sans-serif;font-size:12px;line-height:1.5;color:#e0e0f0;background:#1a1a2e;border:1px solid #2d2d50;border-radius:8px;white-space:normal;word-wrap:break-word;';
  const name = document.createElement('div');
  name.style.cssText = 'font-weight:700;font-size:13px;margin-bottom:4px;color:' + s.color + ';';
  name.textContent = s.name;
  el.appendChild(name);
  const desc = document.createElement('div');
  desc.style.cssText = 'color:#8888aa;margin-bottom:4px;';
  desc.textContent = s.desc;
  el.appendChild(desc);
  const conn = document.createElement('div');
  conn.style.cssText = 'color:#5c9cfc;font-size:11px;margin-bottom:6px;';
  conn.textContent = s.links.length + ' connections';
  el.appendChild(conn);
  if (TIPS[s.id]) {
    const hr = document.createElement('div');
    hr.style.cssText = 'border-top:1px solid #2d2d50;margin:6px 0;';
    el.appendChild(hr);
    const tip = document.createElement('div');
    tip.style.cssText = 'color:#5cfc9c;font-size:11px;';
    tip.textContent = TIPS[s.id];
    el.appendChild(tip);
  }
  return el;
}

  color: { background: s.color, border: s.color, highlight: { background: '#fff', border: s.color }, hover: { background: s.color + 'cc', border: '#fff' } },
  font: { color: getComputedStyle(document.documentElement).getPropertyValue('--graph-font').trim() || '#e0e0f0', size: 13, face: 'Inter', strokeWidth: 3, strokeColor: getComputedStyle(document.documentElement).getPropertyValue('--graph-stroke').trim() || '#0f0f1a' },
  size: s.links.length > 4 ? 30 : s.links.length > 2 ? 24 : 18,
  shape: 'dot',
  borderWidth: 2,
  shadow: { enabled: true, color: s.color + '40', size: 10 }
}));
const nodesDS = new vis.DataSet(nodesArr);

// Build edges — thickness based on shared connections (weight)
const edgeSet = new Set();
const edgesArr = [];
SHEETS.forEach(s => {
  s.links.forEach(t => {
    const key = [Math.min(s.id,t), Math.max(s.id,t)].join('-');
    if (!edgeSet.has(key)) {
      edgeSet.add(key);
      const target = SHEETS.find(x => x.id === t);
      const shared = target ? s.links.filter(l => target.links.includes(l)).length : 0;
      const w = 1 + Math.min(shared, 4) * 0.8;
      edgesArr.push({ from: s.id, to: t, color: { color: getComputedStyle(document.documentElement).getPropertyValue('--graph-edge').trim() || '#2d2d50', highlight: '#7c5cfc', hover: '#7c5cfc' }, width: w, smooth: { type: 'continuous' } });
    }
  });
});
const edgesDS = new vis.DataSet(edgesArr);

const container = document.getElementById('graph');
const defaultOpts = {
  physics: { barnesHut: { gravitationalConstant: -3000, centralGravity: 0.4, springLength: 120, damping: 0.5 }, stabilization: { iterations: 200 } },
  interaction: { hover: true, tooltipDelay: 200, navigationButtons: false, multiselect: false, tooltipDelay: 150 },
  layout: { improvedLayout: true }
};
let network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  ...defaultOpts,
  physics: { enabled: false },
  layout: { hierarchical: false }
});

  if (items.length > 0) y0 += 150;
});

function rebuildNetwork(opts) {
  network.destroy();
  network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, opts || defaultOpts);
  network.once('stabilizationIterationsDone', () => {
    network.fit({ animation: { duration: 500 } });
  });
  bindNetworkEvents();
}

// === Neighbor highlight on hover ===
let highlightActive = false;
function bindNetworkEvents() {
  network.on('hoverNode', params => { highlightNeighbors(params.node); });
  network.on('blurNode', () => { resetHighlight(); });
  network.on('click', params => {
    if (params.nodes.length) {
      const id = params.nodes[0];
      document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (card) { card.classList.add('open'); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
}
bindNetworkEvents();

function highlightNeighbors(nodeId) {
  const connNodes = network.getConnectedNodes(nodeId);
  const connEdges = network.getConnectedEdges(nodeId);
  const allNodes = nodesDS.get();
  const allEdges = edgesDS.get();
  allNodes.forEach(n => {
    if (n.id === nodeId || connNodes.includes(n.id)) {
      n.opacity = 1.0;
    } else {
      n.opacity = 0.15;
    }
  });
  allEdges.forEach(e => {
    if (connEdges.includes(e.id)) {
      e.color = { ...e.color, opacity: 1.0 };
      e.width = (e._origWidth || e.width) + 1;
    } else {
      e.color = { ...e.color, opacity: 0.08 };
    }
  });
  nodesDS.update(allNodes);
  edgesDS.update(allEdges);
  highlightActive = true;
}

function resetHighlight() {
  const allNodes = nodesDS.get();
  const allEdges = edgesDS.get();
  allNodes.forEach(n => { n.opacity = 1.0; n.hidden = false; });
  allEdges.forEach(e => {
    e.hidden = false;
    e.color = { ...e.color, opacity: 1.0 };
    const s = SHEETS.find(x => x.id === e.from);
    const t = SHEETS.find(x => x.id === e.to);
    const shared = (s && t) ? s.links.filter(l => t.links.includes(l)).length : 0;
    e.width = 1 + Math.min(shared, 4) * 0.8;
  });
  nodesDS.update(allNodes);
  edgesDS.update(allEdges);
  highlightActive = false;
}

    const match = c.dataset.name.includes(q) || c.querySelector('.card-body').textContent.toLowerCase().includes(q);

    allNodes.forEach(n => { n.opacity = matchIds.includes(n.id) ? 1.0 : 0.15; });

// === Category filter with Apply button ===
let activeCats = new Set();

function applyCategoryFilter() {
  // Read checked state from dropdown checkboxes
  activeCats.clear();
  document.querySelectorAll('#categoryDrop input[data-cat]').forEach(cb => {
    if (cb.checked) activeCats.add(cb.dataset.cat);
  });
  applyFilters();
  document.getElementById('categoryDrop').classList.remove('open');
}

function resetCategoryFilter() {
  activeCats.clear();
  document.querySelectorAll('#categoryDrop input[data-cat]').forEach(cb => { cb.checked = false; });
  applyFilters();
  document.getElementById('categoryDrop').classList.remove('open');
}

function applyFilters() {
  const showAll = activeCats.size === 0;
  // Filter cards
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('hidden', !showAll && !activeCats.has(c.dataset.cat));
  });
  // Update badge text
  const badge = document.getElementById('catBadge');
  if (showAll) {
    badge.textContent = 'All';
  } else {
    badge.textContent = activeCats.size + ' selected';
  }
  // Graph: connected-only filtering
  if (showAll) {
    resetHighlight();
    network.setSelection({ nodes: [], edges: [] });
    // Show all edges
    const allEdges = edgesDS.get();
    allEdges.forEach(e => { e.hidden = false; e.color = { ...e.color, opacity: 1.0 }; });
    edgesDS.update(allEdges);
  } else {
    // Get primary IDs (nodes in selected categories)
    const primaryIds = new Set(SHEETS.filter(s => activeCats.has(s.cat)).map(s => s.id));
    // Get connected IDs (neighbors of primary nodes)
    const connectedIds = new Set(primaryIds);
    primaryIds.forEach(id => {
      const sheet = SHEETS.find(s => s.id === id);
      if (sheet) sheet.links.forEach(l => connectedIds.add(l));
    });
    // Update nodes: primary = full, connected = dimmed, others = hidden
    const allNodes = nodesDS.get();
    allNodes.forEach(n => {
      if (primaryIds.has(n.id)) {
        n.opacity = 1.0;
        n.hidden = false;
      } else if (connectedIds.has(n.id)) {
        n.opacity = 0.3;
        n.hidden = false;
      } else {
        n.hidden = true;
      }
    });
    nodesDS.update(allNodes);
    // Update edges: show only edges where BOTH endpoints are visible
    const allEdges = edgesDS.get();
    allEdges.forEach(e => {
      const fromVisible = connectedIds.has(e.from);
      const toVisible = connectedIds.has(e.to);
      const bothPrimary = primaryIds.has(e.from) && primaryIds.has(e.to);
      if (fromVisible && toVisible) {
        e.hidden = false;
        e.color = { ...e.color, opacity: bothPrimary ? 1.0 : 0.3 };
      } else {
        e.hidden = true;
      }
    });
    edgesDS.update(allEdges);
    network.selectNodes([...primaryIds]);
    setTimeout(() => network.fit({ animation: { duration: 400 } }), 50);
  }
  updateStats();
  // Update guide count in right panel
  const visible = document.querySelectorAll('.card:not(.hidden)').length;
  document.getElementById('guideCount').textContent = visible + ' guides';
}

function updateStats() {
  const visible = document.querySelectorAll('.card:not(.hidden)').length;
  const total = SHEETS.length;
  const cats = [
    { key:'agent', label:'Agent', count:SHEETS.filter(s=>s.cat==='agent').length },
    { key:'intel', label:'Intel', count:SHEETS.filter(s=>s.cat==='intel').length },
    { key:'mcp', label:'MCP', count:SHEETS.filter(s=>s.cat==='mcp').length },
    { key:'test', label:'Test', count:SHEETS.filter(s=>s.cat==='test').length },
    { key:'rules', label:'Rules', count:SHEETS.filter(s=>s.cat==='rules').length },
    { key:'ref', label:'Ref', count:SHEETS.filter(s=>s.cat==='ref').length },
    { key:'creative', label:'Creative', count:SHEETS.filter(s=>s.cat==='creative').length }
  ];
  const allActive = activeCats.size === 0 ? ' active-stat' : '';
  const allHtml = `<span class="stat-cat${allActive}" style="color:var(--accent)" data-scat="all">All (${total})</span>`;
  const catHtml = cats.map(c => {
    const active = activeCats.has(c.key) ? ' active-stat' : '';
    return `<span class="stat-cat${active}" style="color:var(--cat-${c.key})" data-scat="${c.key}">${c.label} (${c.count})</span>`;
  }).join(' &bull; ');
  document.getElementById('stats').innerHTML = `
    <div class="stat">Showing <span>${visible}</span> of <span>${total}</span> guides</div>
    <div class="stat">Categories: ${allHtml} &bull; ${catHtml}</div>
  `;
  // Bind click on stat categories — syncs with dropdown checkboxes
  document.querySelectorAll('.stat-cat').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.dataset.scat;
      if (cat === 'all') {
        activeCats.clear();
        document.querySelectorAll('#categoryDrop input[data-cat]').forEach(cb => { cb.checked = false; });
      } else {
        if (activeCats.has(cat)) {
          activeCats.delete(cat);
        } else {
          activeCats.add(cat);
        }
        // Sync checkbox
        const cb = document.querySelector(`#categoryDrop input[data-cat="${cat}"]`);
        if (cb) cb.checked = activeCats.has(cat);
      }
      applyFilters();
    });
  });
}
updateStats();

// === Resize handle ===
const resizeHandle = document.getElementById('resizeHandle');
const graphPanel = document.getElementById('graphPanel');
const layout = document.getElementById('layout');
let isResizing = false;

resizeHandle.addEventListener('mousedown', e => {
  isResizing = true;
  resizeHandle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const rect = layout.getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  const clamped = Math.max(15, Math.min(85, pct));
  graphPanel.style.width = clamped + '%';
  network.redraw();
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    resizeHandle.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    network.fit({ animation: { duration: 300 } });
  }
});

// === Graph Controls ===
let currentLayout = 'grid';
const layoutBtns = ['btnPhysics','btnTree','btnRadial','btnCircle','btnGrid'];

function graphFit() {
  network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
}

function graphZoomIn() {
  const scale = network.getScale();
  network.moveTo({ scale: scale * 1.4, animation: { duration: 300 } });
}

function graphZoomOut() {
  const scale = network.getScale();
  network.moveTo({ scale: scale / 1.4, animation: { duration: 300 } });
}

function highlightLayoutBtn(name) {
  layoutBtns.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active-ctrl', id === 'btn' + name.charAt(0).toUpperCase() + name.slice(1));
  });
}

function setLayout(name) {
  // If clicking the already-active layout, reset to physics
  if (name === currentLayout && name !== 'physics') {
    name = 'physics';
  }
  currentLayout = name;
  highlightLayoutBtn(name);

  if (name === 'physics') {
    rebuildNetwork();
  } else if (name === 'tree') {
    rebuildNetwork({
      layout: { hierarchical: { enabled: true, direction: 'UD', sortMethod: 'hubsize', levelSeparation: 100, nodeSpacing: 150 } },
      physics: { enabled: true, hierarchicalRepulsion: { centralGravity: 0.2, springLength: 100, nodeSpacing: 120 } },
      interaction: defaultOpts.interaction
    });
  } else if (name === 'radial') {
    // Radial: most-connected node at center, others radiate out by distance
    rebuildNetwork({
      layout: { hierarchical: false },
      physics: { enabled: false },
      interaction: defaultOpts.interaction
    });
    const sorted = [...SHEETS].sort((a, b) => b.links.length - a.links.length);
    const hubId = sorted[0].id;
    network.moveNode(hubId, 0, 0);
    // Ring 1: direct connections, Ring 2: everything else
    const ring1 = sorted[0].links;
    const ring2 = SHEETS.filter(s => s.id !== hubId && !ring1.includes(s.id)).map(s => s.id);
    ring1.forEach((id, i) => {
      const angle = (2 * Math.PI * i) / ring1.length - Math.PI / 2;
      network.moveNode(id, 180 * Math.cos(angle), 180 * Math.sin(angle));
    });
    ring2.forEach((id, i) => {
      const angle = (2 * Math.PI * i) / ring2.length - Math.PI / 2;
      network.moveNode(id, 350 * Math.cos(angle), 350 * Math.sin(angle));
    });
    setTimeout(() => network.fit({ animation: { duration: 500 } }), 100);
  } else if (name === 'circle') {
    rebuildNetwork({
      layout: { hierarchical: false },
      physics: { enabled: false },
      interaction: defaultOpts.interaction
    });
    const r = 280;
    SHEETS.forEach((s, i) => {
      const angle = (2 * Math.PI * i) / SHEETS.length - Math.PI / 2;
      network.moveNode(s.id, r * Math.cos(angle), r * Math.sin(angle));
    });
    setTimeout(() => network.fit({ animation: { duration: 500 } }), 100);
  } else if (name === 'grid') {
    // Grid: group by category, rows per category
    rebuildNetwork({
      layout: { hierarchical: false },
      physics: { enabled: false },
      interaction: defaultOpts.interaction
    });
    const catOrder = ['agent','intel','mcp','test','rules','ref','creative'];
    let y = 0;
    catOrder.forEach(cat => {
      const items = SHEETS.filter(s => s.cat === cat);
      items.forEach((s, i) => {
        network.moveNode(s.id, i * 200, y);
      });
      if (items.length > 0) y += 150;
    });
    setTimeout(() => network.fit({ animation: { duration: 500 } }), 100);
  }
}

// === Export as PNG ===
function exportPNG() {
  const canvas = container.querySelector('canvas');
  if (!canvas) return;
  const link = document.createElement('a');
  link.download = 'ai-toolkit-reference-graph.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// === Fullscreen ===
function toggleFullscreen() {
  graphPanel.classList.toggle('fullscreen');
  setTimeout(() => network.fit({ animation: { duration: 400 } }), 100);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && graphPanel.classList.contains('fullscreen')) {
    graphPanel.classList.remove('fullscreen');
    setTimeout(() => network.fit({ animation: { duration: 400 } }), 100);
  }
});

// === Theme toggle ===
let currentTheme = 'dark';
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  const btn = document.getElementById('themeToggle');
  btn.innerHTML = currentTheme === 'dark' ? '&#9788;' : '&#9790;';
  btn.title = currentTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  // Update graph colors
  const cs = getComputedStyle(document.documentElement);
  const fontColor = cs.getPropertyValue('--graph-font').trim();
  const strokeColor = cs.getPropertyValue('--graph-stroke').trim();
  const edgeColor = cs.getPropertyValue('--graph-edge').trim();
  const allNodes = nodesDS.get();
  allNodes.forEach(n => {
    n.font = { ...n.font, color: fontColor, strokeColor: strokeColor };
  });
  nodesDS.update(allNodes);
  const allEdges = edgesDS.get();
  allEdges.forEach(e => {
    e.color = { ...e.color, color: edgeColor };
  });
  edgesDS.update(allEdges);
}

// === Animated edge pulses ===
let animRunning = false;
let animFrame = null;
function startEdgeAnimation() {
  if (animRunning) return;
  animRunning = true;
  const canvas = document.createElement('canvas');
  canvas.className = 'edge-anim-canvas';
  const graphDiv = document.getElementById('graph');
  graphDiv.style.position = 'relative';
  graphDiv.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let t = 0;
  function draw() {
    if (!animRunning) { canvas.remove(); return; }
    canvas.width = graphDiv.offsetWidth;
    canvas.height = graphDiv.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const positions = network.getPositions();
    const scale = network.getScale();
    const viewPos = network.getViewPosition();
    edgesArr.forEach(e => {
      const from = positions[e.from];
      const to = positions[e.to];
      if (!from || !to) return;
      const fx = (from.x - viewPos.x) * scale + canvas.width / 2;
      const fy = (from.y - viewPos.y) * scale + canvas.height / 2;
      const tx = (to.x - viewPos.x) * scale + canvas.width / 2;
      const ty = (to.y - viewPos.y) * scale + canvas.height / 2;
      const progress = ((t * 0.003) + (e.from * 0.1)) % 1;
      const px = fx + (tx - fx) * progress;
      const py = fy + (ty - fy) * progress;
      ctx.beginPath();
      ctx.arc(px, py, 3 * scale, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(124, 92, 252, 0.6)';
      ctx.fill();
    });
    t++;
    animFrame = requestAnimationFrame(draw);
  }
  draw();
}
function stopEdgeAnimation() {
  animRunning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  const c = document.querySelector('.edge-anim-canvas');
  if (c) c.remove();
}
// Start animation by default — toggle with: startEdgeAnimation() / stopEdgeAnimation()
startEdgeAnimation();
